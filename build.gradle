import org.gradle.external.javadoc.JavadocMemberLevel

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

description = 'Behavior-preserving Java 8 port of Zea TCP Transport'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
    withJavadocJar()
}

// Pin equivalent dependency generations that can be compiled and loaded on Java 8.
dependencies {
    api 'io.netty:netty-all:4.2.19.Final'
    api 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    api 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.22.3'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.22.3'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.3'
    api 'org.slf4j:slf4j-api:2.0.20'
    api 'ch.qos.logback:logback-classic:1.3.16'
    api 'com.google.dagger:dagger:2.51.1'
    api 'javax.inject:javax.inject:1'
    api 'com.github.ben-manes.caffeine:caffeine:2.9.3'
    api 'net.logstash.logback:logstash-logback-encoder:7.4'

    annotationProcessor 'com.google.dagger:dagger-compiler:2.51.1'
    testAnnotationProcessor 'com.google.dagger:dagger-compiler:2.51.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxParallelForks = 1
    forkEvery = 1
    doFirst {
        systemProperty 'zea.test.classpath', classpath.asPath
    }
    reports {
        junitXml.required = true
        html.required = true
    }
}

def generatedDaggerSources = [
    '**/Dagger*.java',
    '**/*_Factory.java',
    '**/*_Provide*Factory.java',
    '**/*_MembersInjector.java'
]

def documentationListeners = [:]

gradle.taskGraph.afterTask { task, state ->
    def listener = documentationListeners.remove(task)
    if (listener != null) {
        task.logging.removeStandardErrorListener(listener)
    }
}

tasks.withType(Javadoc).configureEach {
    failOnError = true
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.locale = 'en'
    options.memberLevel = JavadocMemberLevel.PRIVATE
    options.addBooleanOption('Xdoclint:all', true)
    exclude generatedDaggerSources
    def warnings = Collections.synchronizedList([])
    doFirst {
        warnings.clear()
        def listener = { CharSequence output ->
            if (output.toString() =~ /(?i)\bwarning\b|警告/) {
                warnings.add(output.toString())
            }
        } as org.gradle.api.logging.StandardOutputListener
        documentationListeners[delegate] = listener
        logging.addStandardErrorListener(listener)
    }
    doLast {
        def report = layout.buildDirectory.file("reports/javadoc/${name}-warnings.txt").get().asFile
        report.parentFile.mkdirs()
        report.text = warnings.join('')
        if (!warnings.isEmpty()) {
            throw new GradleException("${name} emitted JavaDoc warnings; see ${report}")
        }
    }
}

tasks.named('javadoc', Javadoc) {
    dependsOn tasks.named('classes')
}

tasks.register('testJavadoc', Javadoc) {
    description = 'Generates strict documentation for the preserved test sources.'
    group = 'documentation'
    dependsOn tasks.named('testClasses')
    source = sourceSets.test.allJava
    classpath = sourceSets.test.compileClasspath + sourceSets.test.output + sourceSets.main.output
    destinationDir = layout.buildDirectory.dir('docs/testJavadoc').get().asFile
}

tasks.register('runExample', JavaExec) {
    description = 'Runs an inherited application example on the Java 8 toolchain.'
    group = 'application'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = providers.gradleProperty('exampleMain').orElse('com.akakata.TestServer')
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

apply from: 'gradle/central-publishing.gradle'
